services:
  django_app:
    image: web2
    container_name: web2
    restart: always
    volumes:
      - ./env.py:/app/env.py:Z
      - ./staticfiles:/app/staticfiles:Z
    ports:
      - "8000:8000"
    # Use sh -c to run multiple commands in the entrypoint
    command: sh -c "python manage.py collectstatic --noinput && 
             gunicorn --workers 3 --bind 0.0.0.0:8000 backend.wsgi:application"
    networks:
      - app_network



  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - django_app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

