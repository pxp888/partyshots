server {
    listen 80;
    server_name 51.20.201.88; # Or your domain

    location / {
        proxy_pass http://django_app:8000; # "django_app" is the container name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve static files directly if not using WhiteNoise
    location /assets/ {
        alias /app/staticfiles/;  # This MUST match your Django STATIC_ROOT
    }
}
